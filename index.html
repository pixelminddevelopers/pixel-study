<!DOCTYPE html>
<html lang="en" data-theme="paper">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pixel Study — SSC Class 10 Study Companion</title>
<meta name="description" content="A focused study companion for Maharashtra State Board Class 10: Mathematics Part I &amp; II and Science Part I &amp; II.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Serif:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ============================================================
   Pixel Study — SSC Class 10 Study Companion
   Design concept: the Indian board-exam answer sheet — a ruled
   page with a red margin rule, spiral-notebook punch holes, and
   a teacher's correction stamp for completed work.
   ============================================================ */

/* ---------- Reset ---------- */
*,*::before,*::after{box-sizing:border-box;}
html,body{margin:0;padding:0;}
img,svg{display:block;max-width:100%;}
button,input,textarea,select{font:inherit;color:inherit;}
button{cursor:pointer;background:none;border:none;}
a{color:inherit;}
ul,ol{margin:0;padding:0;list-style:none;}
h1,h2,h3,h4,p{margin:0;}
:focus{outline:none;}
:focus-visible{outline:2.5px solid var(--focus);outline-offset:2px;border-radius:4px;}

/* ---------- Design tokens ---------- */
html{
  font-size:clamp(14.5px,0.6vw + 13px,16.5px);
}
:root, [data-theme="paper"]{
  --ink:#1B2A4A;
  --ink-soft:#4B5A78;
  --ink-faint:#8592AA;
  --paper:#F2F5FA;
  --paper-raised:#FFFFFF;
  --rule:#D7E0EE;
  --rule-strong:#BFCBE0;
  --margin:#B23A2F;
  --margin-soft:#E7C9C4;
  --accent:#2F7D5D;
  --accent-soft:#DCEEE5;
  --gold:#B8791A;
  --gold-soft:#F3E4C6;
  --focus:#2F5D9E;
  --shadow-sm:0 1px 2px rgba(27,42,74,.07);
  --shadow-md:0 6px 20px rgba(27,42,74,.10);
  --shadow-lg:0 18px 44px rgba(27,42,74,.16);
  --c-math1:#2F5D9E; --c-math1-ink:#fff;
  --c-math2:#2F7D5D; --c-math2-ink:#fff;
  --c-sci1:#C98A1F;  --c-sci1-ink:#1B2A4A;
  --c-sci2:#8E3B62;  --c-sci2-ink:#fff;
  color-scheme:light;
}
[data-theme="slate"]{
  --ink:#EAEEF6;
  --ink-soft:#B7C0D6;
  --ink-faint:#7C8AA6;
  --paper:#141C29;
  --paper-raised:#1D2736;
  --rule:#2A3547;
  --rule-strong:#37455B;
  --margin:#E2685A;
  --margin-soft:#4A2C2A;
  --accent:#5FCB9E;
  --accent-soft:#1E3A30;
  --gold:#F0B429;
  --gold-soft:#3A2F14;
  --focus:#7FA8E8;
  --shadow-sm:0 1px 2px rgba(0,0,0,.3);
  --shadow-md:0 6px 20px rgba(0,0,0,.35);
  --shadow-lg:0 18px 44px rgba(0,0,0,.5);
  --c-math1:#4E7FC7; --c-math1-ink:#0B1220;
  --c-math2:#4FAE87; --c-math2-ink:#0B1220;
  --c-sci1:#E3AE49;  --c-sci1-ink:#0B1220;
  --c-sci2:#B5638A;  --c-sci2-ink:#0B1220;
  color-scheme:dark;
}

body{
  background:var(--paper);
  color:var(--ink);
  font-family:'IBM Plex Sans',system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
  line-height:1.5;
  -webkit-font-smoothing:antialiased;
  transition:background .25s ease,color .25s ease;
  min-height:100vh;
  min-height:100dvh;
}
h1,h2,h3,.font-display{font-family:'IBM Plex Serif',Georgia,serif;}
.font-mono,code,.mono{font-family:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,monospace;}

@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation-duration:.001ms !important;animation-iteration-count:1 !important;transition-duration:.001ms !important;scroll-behavior:auto !important;}
}

/* ---------- Layout shell ---------- */
.app-shell{
  display:flex;
  min-height:100vh;
  min-height:100dvh;
  align-items:stretch;
}
.main-col{
  flex:1;
  min-width:0;
  display:flex;
  flex-direction:column;
}

/* ---------- Nav rail ---------- */
.nav-rail{
  width:270px;
  flex:0 0 270px;
  background:var(--paper-raised);
  border-right:1px solid var(--rule);
  display:flex;
  flex-direction:column;
  position:sticky;
  top:0;
  height:100vh;
  height:100dvh;
  padding-left:18px;
  position:relative;
  z-index:40;
}
.rail-holes{
  position:absolute;
  left:0;top:0;bottom:0;width:18px;
  border-right:1px dashed var(--rule-strong);
  display:flex;flex-direction:column;justify-content:space-evenly;align-items:center;
  padding:28px 0;
}
.rail-holes span{
  width:8px;height:8px;border-radius:50%;
  background:var(--paper);
  border:1.5px solid var(--rule-strong);
  box-shadow:inset 0 1px 2px rgba(0,0,0,.15);
}
.brand{
  display:flex;align-items:center;gap:10px;
  padding:22px 16px 18px;
  border-bottom:1px solid var(--rule);
}
.brand-mark{
  width:38px;height:38px;border-radius:9px;
  background:var(--ink);color:var(--paper-raised);
  display:flex;align-items:center;justify-content:center;
  font-family:'IBM Plex Serif',serif;font-weight:700;font-size:1.15rem;
  flex:0 0 auto;
}
.brand-text{display:flex;flex-direction:column;line-height:1.2;min-width:0;}
.brand-text strong{font-family:'IBM Plex Serif',serif;font-size:1.05rem;letter-spacing:.2px;}
.brand-text small{color:var(--ink-faint);font-size:.72rem;letter-spacing:.3px;}
.drawer-close{display:none;margin-left:auto;width:32px;height:32px;border-radius:8px;align-items:center;justify-content:center;color:var(--ink-soft);}
.drawer-close:hover{background:var(--paper);}

.nav-groups{flex:1;overflow-y:auto;padding:14px 12px 14px 16px;}
.nav-group{margin-bottom:20px;}
.nav-group-label{
  font-family:'IBM Plex Mono',monospace;
  font-size:.64rem;text-transform:uppercase;letter-spacing:1.4px;
  color:var(--ink-faint);
  padding:0 10px 8px;
}
.nav-item{
  width:100%;
  display:flex;align-items:center;gap:10px;
  padding:9px 10px;
  border-radius:9px;
  font-size:.86rem;
  color:var(--ink-soft);
  text-align:left;
  transition:background .15s ease,color .15s ease;
}
.nav-item .nav-ic{flex:0 0 auto;width:20px;height:20px;color:var(--ink-faint);}
.nav-item:hover{background:var(--paper);color:var(--ink);}
.nav-item.active{background:var(--ink);color:var(--paper-raised);}
.nav-item.active .nav-ic{color:var(--paper-raised);}
.nav-chip{
  flex:0 0 auto;width:24px;height:24px;border-radius:6px;
  display:flex;align-items:center;justify-content:center;
  font-family:'IBM Plex Mono',monospace;font-size:.62rem;font-weight:700;
}
.rail-footer{padding:14px 16px 18px;border-top:1px solid var(--rule);}
.theme-toggle{
  display:flex;align-items:center;gap:8px;width:100%;
  padding:9px 10px;border-radius:9px;border:1px solid var(--rule-strong);
  font-size:.8rem;color:var(--ink-soft);
}
.theme-toggle:hover{background:var(--paper);}
.theme-toggle .nav-ic{width:16px;height:16px;}

.drawer-overlay{
  display:none;
  position:fixed;inset:0;background:rgba(10,15,25,.45);
  z-index:35;
}

/* ---------- Topbar ---------- */
.topbar{
  position:sticky;top:0;z-index:20;
  display:flex;align-items:center;gap:12px;
  padding:14px clamp(16px,3vw,32px);
  background:color-mix(in srgb, var(--paper) 88%, transparent);
  backdrop-filter:blur(8px);
  border-bottom:1px solid var(--rule);
}
.hamburger{display:none;width:36px;height:36px;flex:0 0 auto;align-items:center;justify-content:center;border-radius:8px;color:var(--ink-soft);}
.hamburger:hover{background:var(--paper-raised);}
.view-title{font-size:1.15rem;font-weight:600;letter-spacing:.1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.topbar-actions{margin-left:auto;display:flex;align-items:center;gap:8px;min-width:0;}
.icon-btn{
  width:38px;height:38px;flex:0 0 auto;border-radius:9px;
  display:flex;align-items:center;justify-content:center;
  color:var(--ink-soft);border:1px solid transparent;
}
.icon-btn:hover{background:var(--paper-raised);border-color:var(--rule);}
.icon-btn svg{width:18px;height:18px;}

.mini-timer{
  display:none;align-items:center;gap:6px;
  padding:6px 10px;border-radius:20px;
  background:var(--accent-soft);color:var(--accent);
  font-family:'IBM Plex Mono',monospace;font-size:.78rem;font-weight:600;
  border:1px solid transparent;white-space:nowrap;
}
.mini-timer.show{display:flex;}
.mini-timer:hover{border-color:var(--accent);}

.search-wrap{position:relative;width:clamp(140px,22vw,260px);}
.search-wrap input{
  width:100%;padding:8px 12px 8px 34px;border-radius:20px;
  border:1px solid var(--rule-strong);background:var(--paper-raised);
  font-size:.82rem;
}
.search-wrap input:focus-visible{outline:2.5px solid var(--focus);outline-offset:1px;}
.search-ic{position:absolute;left:11px;top:50%;transform:translateY(-50%);width:15px;height:15px;color:var(--ink-faint);pointer-events:none;}
.search-results{
  position:absolute;top:calc(100% + 6px);left:0;right:0;
  background:var(--paper-raised);border:1px solid var(--rule);
  border-radius:12px;box-shadow:var(--shadow-lg);
  max-height:360px;overflow-y:auto;z-index:50;
}
.search-results button{
  width:100%;text-align:left;padding:10px 14px;font-size:.82rem;
  border-bottom:1px solid var(--rule);display:flex;flex-direction:column;gap:2px;
}
.search-results button:last-child{border-bottom:none;}
.search-results button:hover{background:var(--paper);}
.search-results .sr-title{font-weight:600;}
.search-results .sr-meta{font-size:.7rem;color:var(--ink-faint);font-family:'IBM Plex Mono',monospace;}
.search-empty{padding:14px;font-size:.8rem;color:var(--ink-faint);text-align:center;}

/* ---------- Main content ---------- */
.main-content{
  flex:1;
  padding:clamp(16px,3vw,32px);
  max-width:1180px;
  width:100%;
  margin:0 auto;
  background-image:repeating-linear-gradient(var(--paper) 0 34px, var(--rule) 34px 35px);
  background-attachment:local;
}
.view{animation:rise .45s ease both;}
@keyframes rise{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:translateY(0);}}

.section-head{margin-bottom:20px;}
.eyebrow{
  font-family:'IBM Plex Mono',monospace;font-size:.68rem;letter-spacing:1.6px;
  text-transform:uppercase;color:var(--margin);font-weight:600;margin-bottom:6px;
}
.section-head h2{font-size:clamp(1.35rem,1.1rem + 1vw,1.85rem);font-weight:600;}
.section-sub{color:var(--ink-soft);font-size:.92rem;margin-top:6px;max-width:60ch;}

/* ---------- Cards (answer-sheet motif) ---------- */
.sheet-card{
  background:var(--paper-raised);
  border:1px solid var(--rule);
  border-radius:14px;
  box-shadow:var(--shadow-sm);
  position:relative;
  overflow:hidden;
}
.sheet-card::before{
  content:"";position:absolute;left:38px;top:0;bottom:0;width:1.5px;
  background:var(--margin-soft);
}
[data-theme="slate"] .sheet-card::before{background:var(--margin-soft);}

/* ---------- Dashboard ---------- */
.dash-hero{
  display:grid;grid-template-columns:1.4fr 1fr;gap:18px;margin-bottom:22px;
}
.hero-card{
  background:var(--paper-raised);border:1px solid var(--rule);border-radius:18px;
  padding:26px clamp(18px,3vw,32px);box-shadow:var(--shadow-md);
  display:flex;flex-direction:column;justify-content:center;gap:10px;position:relative;
}
.hero-greet{font-size:clamp(1.4rem,1.1rem + 1.3vw,2rem);font-weight:600;letter-spacing:.1px;}
.hero-sub{color:var(--ink-soft);font-size:.94rem;max-width:46ch;}
.hero-stats{display:flex;gap:22px;margin-top:8px;flex-wrap:wrap;}
.hero-stat{display:flex;flex-direction:column;}
.hero-stat b{font-family:'IBM Plex Mono',monospace;font-size:1.5rem;line-height:1;}
.hero-stat span{font-size:.72rem;color:var(--ink-faint);text-transform:uppercase;letter-spacing:.8px;margin-top:5px;}
.exam-chip{
  display:inline-flex;align-items:center;gap:8px;align-self:flex-start;
  background:var(--margin-soft);color:var(--margin);border-radius:20px;
  padding:6px 12px 6px 8px;font-size:.78rem;font-weight:600;cursor:pointer;border:none;
}
[data-theme="slate"] .exam-chip{color:#F3A79A;}
.exam-chip b{font-family:'IBM Plex Mono',monospace;}
.exam-edit{display:flex;gap:8px;align-items:center;margin-top:4px;flex-wrap:wrap;}
.exam-edit input{padding:7px 10px;border-radius:8px;border:1px solid var(--rule-strong);background:var(--paper);}

.ring-card{
  background:var(--paper-raised);border:1px solid var(--rule);border-radius:18px;
  box-shadow:var(--shadow-md);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px;gap:6px;
}
.ring-wrap{position:relative;width:150px;height:150px;}
.ring-wrap svg{width:100%;height:100%;transform:rotate(-90deg);}
.ring-track{fill:none;stroke:var(--rule);stroke-width:11;}
.ring-fill{fill:none;stroke:var(--accent);stroke-width:11;stroke-linecap:round;transition:stroke-dashoffset .6s ease;}
.ring-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;}
.ring-center b{font-family:'IBM Plex Mono',monospace;font-size:1.5rem;}
.ring-center span{font-size:.66rem;color:var(--ink-faint);text-transform:uppercase;letter-spacing:.6px;text-align:center;max-width:90px;}

.subject-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:16px;margin-bottom:24px;}
.subject-card{
  background:var(--paper-raised);border:1px solid var(--rule);border-radius:16px;
  padding:20px;box-shadow:var(--shadow-sm);transition:transform .18s ease,box-shadow .18s ease;
  display:flex;flex-direction:column;gap:12px;text-align:left;
}
.subject-card:hover{transform:translateY(-3px);box-shadow:var(--shadow-md);}
.subject-top{display:flex;align-items:center;gap:12px;}
.subject-chip{
  width:44px;height:44px;border-radius:11px;display:flex;align-items:center;justify-content:center;
  font-family:'IBM Plex Mono',monospace;font-weight:700;font-size:.82rem;flex:0 0 auto;
}
.subject-name{font-weight:600;font-size:1rem;line-height:1.25;}
.subject-name small{display:block;font-weight:400;color:var(--ink-faint);font-size:.74rem;margin-top:2px;}
.bar-track{height:8px;border-radius:6px;background:var(--rule);overflow:hidden;}
.bar-fill{height:100%;border-radius:6px;transition:width .6s ease;}
.subject-meta{display:flex;justify-content:space-between;align-items:center;font-size:.78rem;color:var(--ink-soft);}
.subject-meta b{font-family:'IBM Plex Mono',monospace;color:var(--ink);}
.subject-cta{align-self:flex-start;font-size:.78rem;font-weight:600;color:var(--focus);display:flex;align-items:center;gap:5px;}

.dash-lower{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
.mini-panel{background:var(--paper-raised);border:1px solid var(--rule);border-radius:16px;padding:18px 20px;box-shadow:var(--shadow-sm);}
.mini-panel h3{font-size:.98rem;margin-bottom:12px;display:flex;align-items:center;justify-content:space-between;}
.mini-panel h3 a,.mini-panel h3 button.link{font-size:.74rem;color:var(--focus);font-weight:600;}
.mini-task{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--rule);font-size:.85rem;}
.mini-task:last-child{border-bottom:none;}
.mini-task .dot{width:7px;height:7px;border-radius:50%;background:var(--margin);flex:0 0 auto;}
.empty-note{color:var(--ink-faint);font-size:.84rem;padding:8px 0;}

/* ---------- Buttons ---------- */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:7px;
  padding:10px 18px;border-radius:10px;font-size:.85rem;font-weight:600;
  border:1px solid transparent;transition:all .15s ease;white-space:nowrap;
}
.btn-primary{background:var(--ink);color:var(--paper-raised);}
.btn-primary:hover{opacity:.88;transform:translateY(-1px);}
.btn-ghost{background:transparent;border-color:var(--rule-strong);color:var(--ink);}
.btn-ghost:hover{background:var(--paper-raised);}
.btn-danger{background:transparent;border-color:var(--margin-soft);color:var(--margin);}
.btn-danger:hover{background:var(--margin-soft);}
.btn-sm{padding:7px 12px;font-size:.78rem;border-radius:8px;}
.btn:disabled{opacity:.45;cursor:not-allowed;}

/* ---------- Subject / chapter view ---------- */
.subject-header{
  display:flex;align-items:center;gap:16px;margin-bottom:20px;flex-wrap:wrap;
}
.subject-icon-lg{width:56px;height:56px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-family:'IBM Plex Mono',monospace;font-weight:700;font-size:1.1rem;flex:0 0 auto;}
.subject-progress-line{flex:1;min-width:200px;}
.subject-progress-line .bar-track{height:10px;}
.subject-progress-num{font-family:'IBM Plex Mono',monospace;font-size:.8rem;color:var(--ink-soft);margin-top:6px;}

.chapter-card{margin-bottom:14px;}
.chapter-head{
  display:flex;align-items:center;gap:14px;padding:16px 18px 16px 52px;cursor:pointer;
}
.chapter-no{
  font-family:'IBM Plex Mono',monospace;font-weight:700;color:var(--margin);font-size:.82rem;
  flex:0 0 auto;
}
.chapter-title{font-weight:600;font-size:.94rem;flex:1;min-width:0;}
.chapter-title small{display:block;font-weight:400;color:var(--ink-faint);font-size:.72rem;margin-top:2px;}
.status-group{display:flex;gap:4px;flex:0 0 auto;}
.status-btn{
  width:30px;height:30px;border-radius:8px;border:1px solid var(--rule-strong);
  display:flex;align-items:center;justify-content:center;font-size:.85rem;color:var(--ink-faint);
}
.status-btn:hover{background:var(--paper);}
.status-btn.active[data-status="not-started"]{background:var(--rule);color:var(--ink-soft);border-color:var(--rule);}
.status-btn.active[data-status="in-progress"]{background:var(--gold-soft);color:var(--gold);border-color:var(--gold);}
.status-btn.active[data-status="done"]{background:var(--accent-soft);color:var(--accent);border-color:var(--accent);}
.chevron{width:18px;height:18px;color:var(--ink-faint);transition:transform .2s ease;flex:0 0 auto;}
.chapter-card.open .chevron{transform:rotate(180deg);}

.stamp{
  position:absolute;top:14px;right:16px;
  border:2px solid var(--accent);color:var(--accent);
  border-radius:8px;padding:3px 9px;font-size:.62rem;font-weight:700;letter-spacing:.6px;
  transform:rotate(-8deg);font-family:'IBM Plex Mono',monospace;text-transform:uppercase;
  pointer-events:none;
}

.chapter-body{padding:0 20px 22px 52px;display:none;}
.chapter-card.open .chapter-body{display:block;animation:rise .3s ease both;}
.chapter-body h4{font-size:.74rem;text-transform:uppercase;letter-spacing:.8px;color:var(--ink-faint);margin:14px 0 8px;}
.chapter-body h4:first-child{margin-top:2px;}
.formula-row{display:flex;justify-content:space-between;gap:14px;padding:8px 0;border-bottom:1px dashed var(--rule);font-size:.85rem;flex-wrap:wrap;}
.formula-row:last-child{border-bottom:none;}
.formula-row .f-name{color:var(--ink-soft);flex:1 1 160px;}
.formula-row .f-expr{font-family:'IBM Plex Mono',monospace;font-weight:600;color:var(--ink);flex:1 1 200px;text-align:right;}
.q-row{display:flex;justify-content:space-between;gap:10px;padding:7px 0;font-size:.85rem;align-items:flex-start;}
.q-row .marks{
  flex:0 0 auto;font-family:'IBM Plex Mono',monospace;font-size:.68rem;font-weight:700;
  background:var(--gold-soft);color:var(--gold);border-radius:6px;padding:2px 7px;white-space:nowrap;
}
.notes-area{width:100%;min-height:90px;padding:12px;border-radius:10px;border:1px solid var(--rule-strong);background:var(--paper);resize:vertical;font-size:.85rem;line-height:1.5;}
.notes-area::placeholder{color:var(--ink-faint);}
.notes-foot{display:flex;justify-content:space-between;align-items:center;margin-top:6px;}
.saved-flag{font-size:.7rem;color:var(--accent);opacity:0;transition:opacity .3s ease;font-weight:600;}
.saved-flag.visible{opacity:1;}

/* ---------- Formula vault ---------- */
.vault-filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px;}
.filter-chip{padding:7px 14px;border-radius:20px;border:1px solid var(--rule-strong);font-size:.8rem;font-weight:600;color:var(--ink-soft);}
.filter-chip.active{background:var(--ink);color:var(--paper-raised);border-color:var(--ink);}
.vault-group{margin-bottom:22px;}
.vault-group-title{display:flex;align-items:center;gap:10px;margin-bottom:10px;}
.vault-group-title .subject-chip{width:30px;height:30px;font-size:.66rem;border-radius:8px;}
.vault-group-title h3{font-size:.98rem;font-weight:600;}
.vault-chapter{background:var(--paper-raised);border:1px solid var(--rule);border-radius:12px;padding:14px 16px;margin-bottom:10px;}
.vault-chapter .vc-head{font-family:'IBM Plex Mono',monospace;font-size:.72rem;color:var(--margin);font-weight:700;margin-bottom:6px;}

/* ---------- Quiz ---------- */
.quiz-select-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;margin-bottom:18px;}
.quiz-opt-card{
  background:var(--paper-raised);border:1.5px solid var(--rule);border-radius:14px;padding:18px;
  text-align:left;display:flex;flex-direction:column;gap:8px;box-shadow:var(--shadow-sm);
}
.quiz-opt-card:hover{border-color:var(--focus);transform:translateY(-2px);}
.quiz-opt-card b{font-size:.95rem;}
.quiz-opt-card span{font-size:.76rem;color:var(--ink-faint);}
.quiz-card{background:var(--paper-raised);border:1px solid var(--rule);border-radius:16px;padding:clamp(18px,3vw,30px);box-shadow:var(--shadow-md);max-width:620px;margin:0 auto;}
.quiz-progress{display:flex;justify-content:space-between;font-family:'IBM Plex Mono',monospace;font-size:.76rem;color:var(--ink-faint);margin-bottom:14px;}
.quiz-q{font-size:1.05rem;font-weight:600;margin-bottom:18px;line-height:1.4;}
.quiz-options{display:flex;flex-direction:column;gap:10px;}
.quiz-option{
  text-align:left;padding:12px 16px;border-radius:10px;border:1.5px solid var(--rule-strong);
  font-size:.88rem;display:flex;align-items:center;gap:10px;
}
.quiz-option:hover:not(:disabled){border-color:var(--focus);}
.quiz-option .opt-letter{width:22px;height:22px;border-radius:50%;border:1.5px solid var(--rule-strong);display:flex;align-items:center;justify-content:center;font-family:'IBM Plex Mono',monospace;font-size:.68rem;flex:0 0 auto;}
.quiz-option.correct{background:var(--accent-soft);border-color:var(--accent);color:var(--accent);}
.quiz-option.correct .opt-letter{background:var(--accent);color:#fff;border-color:var(--accent);}
.quiz-option.wrong{background:var(--margin-soft);border-color:var(--margin);color:var(--margin);}
.quiz-option.wrong .opt-letter{background:var(--margin);color:#fff;border-color:var(--margin);}
.quiz-explain{margin-top:16px;padding:12px 14px;background:var(--paper);border-radius:10px;font-size:.82rem;color:var(--ink-soft);border-left:3px solid var(--focus);}
.quiz-foot{display:flex;justify-content:flex-end;margin-top:18px;}
.quiz-result{text-align:center;}
.quiz-result .big-score{font-family:'IBM Plex Mono',monospace;font-size:2.6rem;font-weight:700;margin:10px 0 4px;}
.quiz-result p{color:var(--ink-soft);font-size:.9rem;margin-bottom:20px;}
.quiz-result-actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;}

/* ---------- Planner ---------- */
.planner-form{display:flex;gap:10px;margin-bottom:20px;flex-wrap:wrap;}
.planner-form input[type="text"]{flex:1 1 220px;padding:11px 14px;border-radius:10px;border:1px solid var(--rule-strong);background:var(--paper-raised);font-size:.86rem;}
.planner-form select{padding:11px 12px;border-radius:10px;border:1px solid var(--rule-strong);background:var(--paper-raised);font-size:.86rem;}
.planner-tabs{display:flex;gap:6px;margin-bottom:14px;}
.planner-tab{padding:6px 14px;border-radius:20px;font-size:.78rem;font-weight:600;color:var(--ink-soft);border:1px solid transparent;}
.planner-tab.active{background:var(--ink);color:var(--paper-raised);}
.task-row{
  display:flex;align-items:center;gap:12px;padding:13px 16px;background:var(--paper-raised);
  border:1px solid var(--rule);border-radius:12px;margin-bottom:8px;
}
.task-check{width:22px;height:22px;border-radius:6px;border:1.5px solid var(--rule-strong);flex:0 0 auto;display:flex;align-items:center;justify-content:center;}
.task-row.done .task-check{background:var(--accent);border-color:var(--accent);color:#fff;}
.task-text{flex:1;font-size:.87rem;min-width:0;word-break:break-word;}
.task-row.done .task-text{color:var(--ink-faint);text-decoration:line-through;}
.task-tag{flex:0 0 auto;font-family:'IBM Plex Mono',monospace;font-size:.65rem;font-weight:700;padding:3px 8px;border-radius:6px;}
.task-del{flex:0 0 auto;width:28px;height:28px;border-radius:8px;color:var(--ink-faint);display:flex;align-items:center;justify-content:center;}
.task-del:hover{background:var(--margin-soft);color:var(--margin);}

/* ---------- Timer ---------- */
.timer-wrap{max-width:460px;margin:0 auto;text-align:center;}
.timer-modes{display:flex;justify-content:center;gap:8px;margin-bottom:26px;}
.timer-mode-btn{padding:8px 16px;border-radius:20px;font-size:.8rem;font-weight:600;color:var(--ink-soft);border:1px solid var(--rule-strong);}
.timer-mode-btn.active{background:var(--ink);color:var(--paper-raised);border-color:var(--ink);}
.timer-face{
  width:min(78vw,270px);height:min(78vw,270px);border-radius:50%;margin:0 auto 26px;
  border:2px solid var(--rule-strong);display:flex;align-items:center;justify-content:center;flex-direction:column;
  background:var(--paper-raised);box-shadow:var(--shadow-md);position:relative;
}
.timer-face.running{border-color:var(--accent);}
#timerDisplay{font-family:'IBM Plex Mono',monospace;font-size:clamp(2.4rem,7vw,3.4rem);font-weight:700;letter-spacing:1px;}
.timer-label{font-size:.72rem;text-transform:uppercase;letter-spacing:1.2px;color:var(--ink-faint);margin-top:6px;}
.timer-controls{display:flex;justify-content:center;gap:10px;margin-bottom:20px;flex-wrap:wrap;}
.timer-subject{display:flex;justify-content:center;gap:8px;margin-bottom:22px;flex-wrap:wrap;}
.timer-stats{display:flex;justify-content:center;gap:28px;flex-wrap:wrap;}
.timer-stats .hero-stat{align-items:center;}

/* ---------- Progress view ---------- */
.progress-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:22px;}
.subject-bar-row{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--rule);}
.subject-bar-row:last-child{border-bottom:none;}
.subject-bar-row .sb-chip{width:34px;height:34px;border-radius:9px;font-size:.62rem;}
.subject-bar-row .sb-info{flex:1;min-width:0;}
.subject-bar-row .sb-info b{font-size:.82rem;display:block;margin-bottom:5px;}
.quiz-history-row{display:flex;align-items:center;gap:12px;padding:9px 0;border-bottom:1px solid var(--rule);font-size:.8rem;}
.quiz-history-row:last-child{border-bottom:none;}
.qh-bar-track{flex:1;height:7px;background:var(--rule);border-radius:5px;overflow:hidden;}
.qh-bar-fill{height:100%;background:var(--focus);border-radius:5px;}
.data-actions{display:flex;gap:10px;margin-top:18px;flex-wrap:wrap;}

/* ---------- Toast ---------- */
.toast{
  position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(20px);
  background:var(--ink);color:var(--paper-raised);padding:11px 20px;border-radius:30px;
  font-size:.83rem;font-weight:500;box-shadow:var(--shadow-lg);opacity:0;pointer-events:none;
  transition:all .25s ease;z-index:100;max-width:90vw;text-align:center;
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

/* ---------- Chips reused ---------- */
.subject-chip[data-s="math1"],.sb-chip[data-s="math1"],.nav-chip[data-s="math1"],.subject-icon-lg[data-s="math1"]{background:var(--c-math1);color:var(--c-math1-ink);}
.subject-chip[data-s="math2"],.sb-chip[data-s="math2"],.nav-chip[data-s="math2"],.subject-icon-lg[data-s="math2"]{background:var(--c-math2);color:var(--c-math2-ink);}
.subject-chip[data-s="sci1"],.sb-chip[data-s="sci1"],.nav-chip[data-s="sci1"],.subject-icon-lg[data-s="sci1"]{background:var(--c-sci1);color:var(--c-sci1-ink);}
.subject-chip[data-s="sci2"],.sb-chip[data-s="sci2"],.nav-chip[data-s="sci2"],.subject-icon-lg[data-s="sci2"]{background:var(--c-sci2);color:var(--c-sci2-ink);}
.task-tag[data-s="math1"]{background:color-mix(in srgb, var(--c-math1) 18%, transparent);color:var(--c-math1);}
.task-tag[data-s="math2"]{background:color-mix(in srgb, var(--c-math2) 18%, transparent);color:var(--c-math2);}
.task-tag[data-s="sci1"]{background:color-mix(in srgb, var(--c-sci1) 22%, transparent);color:var(--c-sci1);}
.task-tag[data-s="sci2"]{background:color-mix(in srgb, var(--c-sci2) 18%, transparent);color:var(--c-sci2);}
.task-tag[data-s="all"]{background:var(--rule);color:var(--ink-soft);}

/* ---------- Responsive ---------- */
@media (max-width:959px){
  .nav-rail{
    position:fixed;top:0;left:0;height:100vh;height:100dvh;
    width:min(84vw,300px);flex-basis:auto;
    transform:translateX(-100%);transition:transform .28s ease;
    box-shadow:var(--shadow-lg);
  }
  .nav-rail.open{transform:translateX(0);}
  .drawer-close{display:flex;}
  .drawer-overlay.open{display:block;}
  .hamburger{display:flex;}
  .search-wrap{width:auto;flex:1;}
  .dash-hero{grid-template-columns:1fr;}
  .subject-grid{grid-template-columns:1fr;}
  .dash-lower{grid-template-columns:1fr;}
  .progress-grid{grid-template-columns:1fr;}
  .quiz-select-grid{grid-template-columns:1fr;}
}
@media (max-width:520px){
  .search-wrap{display:none;}
  .topbar{gap:8px;}
  .hero-stats{gap:16px;}
  .chapter-head{padding:14px 12px 14px 40px;}
  .chapter-body{padding:0 14px 18px 40px;}
  .sheet-card::before{left:26px;}
  .planner-form{flex-direction:column;}
  .planner-form select{width:100%;}
  .timer-controls .btn{flex:1;}
  .quiz-result-actions{flex-direction:column;}
  .quiz-result-actions .btn{width:100%;}
}
@media (max-width:360px){
  .hero-stat b{font-size:1.25rem;}
  .ring-wrap{width:130px;height:130px;}
}

/* Scrollbar (webkit) */
::-webkit-scrollbar{width:10px;height:10px;}
::-webkit-scrollbar-track{background:transparent;}
::-webkit-scrollbar-thumb{background:var(--rule-strong);border-radius:8px;}
::-webkit-scrollbar-thumb:hover{background:var(--ink-faint);}

.visually-hidden{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;}

.owner-name {margin-left: 15px; font-size: 0.9rem; color: var(--ink-soft);}



</style>

/* ============================================================

const SUBJECTS = {

        ],

        qs:[

/* ============================================================
   STORAGE — window.storage when available, in-memory fallback
   otherwise (so the file also works when opened standalone).
   ============================================================ */
const memoryFallback = {};
async function storeGet(key){
  if (window.storage && typeof window.storage.get === "function"){
    try{
      const r = await window.storage.get(key, false);
      return r ? r.value : null;
    }catch(e){ return null; }
  }
  return Object.prototype.hasOwnProperty.call(memoryFallback,key) ? memoryFallback[key] : null;
}
async function storeSet(key, value){
  if (window.storage && typeof window.storage.set === "function"){
    try{ await window.storage.set(key, value, false); return true; }catch(e){ /* fall through */ }
  }
  memoryFallback[key] = value;
  return true;
}

  plannerFilter:"all",

  quiz:{active:false, finished:false, subject:null, questions:[], index:0, score:0, selected:null, answered:false},
  timer:{mode:"focus", duration:{focus:1500, short:300, long:900}, remaining:1500, running:false, subject:"", intervalId:null}
};

function chapterId(subjectKey, no){ return subjectKey + "-" + no; }

function todayStr(){ return new Date().toDateString(); }
function yesterdayStr(){ const d=new Date(); d.setDate(d.getDate()-1); return d.toDateString(); }

function defaultExamDate(){
  const now = new Date();
  let year = now.getFullYear();
  let mar1 = new Date(year,2,1);
  if (now > mar1) mar1 = new Date(year+1,2,1);
  return mar1.toISOString().slice(0,10);
}

function defaultMeta(){
  return {examDate:defaultExamDate(), streak:0, lastActiveDate:null, pomodorosTotal:0, pomodorosToday:0, lastPomodoroDate:null, theme:"paper"};
}

/* ============================================================
   INIT / LOAD
   ============================================================ */
async function loadState(){
  const [progressRaw, notesRaw, plannerRaw, quizRaw, metaRaw] = await Promise.all([
    storeGet("progress"), storeGet("notes"), storeGet("planner"), storeGet("quizHistory"), storeGet("meta")
  ]);
  try{ state.progress = progressRaw ? JSON.parse(progressRaw) : {}; }catch(e){ state.progress = {}; }
  try{ state.notes = notesRaw ? JSON.parse(notesRaw) : {}; }catch(e){ state.notes = {}; }
  try{ state.planner = plannerRaw ? JSON.parse(plannerRaw) : []; }catch(e){ state.planner = []; }
  try{ state.quizHistory = quizRaw ? JSON.parse(quizRaw) : []; }catch(e){ state.quizHistory = []; }
  try{ state.meta = metaRaw ? JSON.parse(metaRaw) : defaultMeta(); }catch(e){ state.meta = defaultMeta(); }
  if (!state.meta.examDate) state.meta.examDate = defaultExamDate();

  updateStreak();
  applyTheme(state.meta.theme || "paper");
}

function updateStreak(){
  const today = todayStr();
  if (state.meta.lastActiveDate === today){ /* already counted today */ }
  else if (state.meta.lastActiveDate === yesterdayStr()){ state.meta.streak = (state.meta.streak||0) + 1; }
  else { state.meta.streak = 1; }
  state.meta.lastActiveDate = today;
  if (state.meta.lastPomodoroDate !== today) state.meta.pomodorosToday = 0;
  storeSet("meta", JSON.stringify(state.meta));
}

   ============================================================ */
function esc(str){
  return String(str).replace(/[&<>"']/g, function(c){
    return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];
  });
}
function subjectList(){ return ["math1","math2","sci1","sci2"]; }
function totalChapters(){ return subjectList().reduce((n,k)=>n+SUBJECTS[k].chapters.length,0); }
function doneChapters(){
  return Object.values(state.progress).filter(function(s){return s==="done";}).length;
}
function subjectDoneCount(key){
  const chs = SUBJECTS[key].chapters;
  let n=0;
  chs.forEach(function(c){ if (state.progress[chapterId(key,c.no)]==="done") n++; });
  return n;
}
function fmtTime(sec){
  const m = Math.floor(sec/60), s = sec%60;
  return (m<10?"0":"")+m+":"+(s<10?"0":"")+s;
}
function daysUntilExam(){
  const target = new Date(state.meta.examDate+"T00:00:00");
  const now = new Date();
  const diff = Math.ceil((target - now) / 86400000);
  return diff;
}

function showToast(msg){
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.classList.add("show");
  clearTimeout(showToast._timer);
  showToast._timer = setTimeout(function(){ t.classList.remove("show"); }, 2200);
}

function applyTheme(theme){
  document.documentElement.setAttribute("data-theme", theme);
  const isSlate = theme === "slate";
  document.getElementById("themeLabelRail").textContent = isSlate ? "Slate mode" : "Paper mode";
  const iconPath = isSlate
    ? '<path d="M20 14.5A8.5 8.5 0 1 1 9.5 4a7 7 0 0 0 10.5 10.5z" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/>'
    : '<circle cx="12" cy="12" r="4.5" stroke="currentColor" stroke-width="1.7"/><path d="M12 2.5v2M12 19.5v2M4.2 4.2l1.4 1.4M18.4 18.4l1.4 1.4M2.5 12h2M19.5 12h2M4.2 19.8l1.4-1.4M18.4 5.6l1.4-1.4" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/>';
  document.getElementById("themeIconRail").innerHTML = iconPath;
  document.getElementById("themeIconTop").innerHTML = iconPath;
}

function setActiveNav(){
  document.querySelectorAll(".nav-item").forEach(function(btn){
    const v = btn.getAttribute("data-view");
    const s = btn.getAttribute("data-subject");
    const active = v === state.view && (v !== "subject" || s === state.subject);
    btn.classList.toggle("active", active);
  });
}

function render(){
  const main = document.getElementById("mainContent");
  let title = VIEW_TITLES[state.view] || "Pixel Study";
  let html = "";
  switch(state.view){
    case "dashboard": html = renderDashboard(); break;
    case "progress": html = renderProgress(); break;
    case "subject":
      html = renderSubject(state.subject);
      title = SUBJECTS[state.subject].label;
      break;
    case "formulas": html = renderVault(); break;
    case "quiz": html = renderQuiz(); break;
    case "planner": html = renderPlanner(); break;
    case "timer": html = renderTimer(); break;
    default: html = renderDashboard();
  }
  main.innerHTML = '<div class="view">' + html + '</div>';
  document.getElementById("viewTitle").textContent = title;
  setActiveNav();
  window.scrollTo({top:0, behavior:"auto"});
  if (state.view === "timer") updateTimerDOM();
  updateMiniTimer();
}

function shuffle(arr){
  const a = arr.slice();
  for (let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    const tmp=a[i]; a[i]=a[j]; a[j]=tmp;
  }
  return a;
}

function startQuiz(subjectKey){
  let questions;
  if (subjectKey === "mixed"){
    let all = [];
    subjectList().forEach(function(k){
      QUIZ_BANK[k].forEach(function(item){ all.push(Object.assign({subject:k}, item)); });
    });
    questions = shuffle(all).slice(0,10);
  } else {
    questions = QUIZ_BANK[subjectKey].map(function(item){ return Object.assign({subject:subjectKey}, item); });
  }
  state.quiz = {active:true, finished:false, subject:subjectKey, questions:questions, index:0, score:0, selected:null, answered:false};
  render();
}

/* ============================================================
   SEARCH
   ============================================================ */
function buildSearchIndex(){
  const idx = [];
  subjectList().forEach(function(key){
    const s = SUBJECTS[key];
    s.chapters.forEach(function(c){
      idx.push({type:"chapter", label:c.title, meta:s.chip+" \u00B7 Ch. "+c.no, subject:key, chapterNo:c.no});
      c.items.forEach(function(it){
        idx.push({type:"formula", label:it.name, meta:s.chip+" \u00B7 Ch. "+c.no+" \u00B7 "+c.title, subject:key, chapterNo:c.no});
      });
    });
  });
  return idx;
}
const SEARCH_INDEX = buildSearchIndex();

function runSearch(query){
  const box = document.getElementById("searchResults");
  const q = query.trim().toLowerCase();
  if (!q){ box.hidden = true; box.innerHTML = ""; return; }
  const matches = SEARCH_INDEX.filter(function(item){ return item.label.toLowerCase().indexOf(q) > -1; }).slice(0,8);
  if (!matches.length){
    box.innerHTML = '<div class="search-empty">No matches for "'+esc(query)+'"</div>';
  } else {
    box.innerHTML = matches.map(function(m){
      return '<button data-action="search-result" data-subject="'+m.subject+'" data-chapter="'+m.chapterNo+'"><span class="sr-title">'+esc(m.label)+'</span><span class="sr-meta">'+esc(m.meta)+'</span></button>';
    }).join("");
  }
  box.hidden = false;
}

/* ============================================================
   TIMER LOGIC
   ============================================================ */
function updateMiniTimer(){
  const badge = document.getElementById("miniTimer");
  const show = state.timer.running && state.view !== "timer";
  badge.classList.toggle("show", show);
  document.getElementById("miniTimerText").textContent = fmtTime(state.timer.remaining);
}
function updateTimerDOM(){
  const disp = document.getElementById("timerDisplay");
  if (disp) disp.textContent = fmtTime(state.timer.remaining);
}
function updateTimerDisplay(){
  updateTimerDOM();
  updateMiniTimer();
}
function playBeep(){
  try{
    const Ctx = window.AudioContext || window.webkitAudioContext;
    const ctx = new Ctx();
    const o = ctx.createOscillator();
    const g = ctx.createGain();
    o.type = "sine";
    o.frequency.value = 880;
    o.connect(g); g.connect(ctx.destination);
    g.gain.setValueAtTime(0.001, ctx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.16, ctx.currentTime+0.02);
    g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime+0.4);
    o.start();
    o.stop(ctx.currentTime+0.42);
    setTimeout(function(){ try{ctx.close();}catch(e){} }, 600);
  }catch(e){ /* audio unavailable, ignore */ }
}
function timerTick(){
  state.timer.remaining--;
  updateTimerDisplay();
  if (state.timer.remaining <= 0){
    clearInterval(state.timer.intervalId);
    state.timer.running = false;
    if (state.timer.mode === "focus"){
      state.meta.pomodorosTotal = (state.meta.pomodorosTotal||0) + 1;
      state.meta.pomodorosToday = (state.meta.pomodorosToday||0) + 1;
      state.meta.lastPomodoroDate = todayStr();
      storeSet("meta", JSON.stringify(state.meta));
    }
    playBeep();
    showToast(state.timer.mode==="focus" ? "Focus session complete \u2014 well done." : "Break\u2019s over \u2014 ready for another round?");
    state.timer.remaining = state.timer.duration[state.timer.mode];
    render();
  }
}
function timerStart(){
  if (state.timer.running) return;
  state.timer.running = true;
  state.timer.intervalId = setInterval(timerTick, 1000);
  render();
}
function timerPause(){
  clearInterval(state.timer.intervalId);
  state.timer.running = false;
  render();
}
function timerReset(){
  clearInterval(state.timer.intervalId);
  state.timer.running = false;
  state.timer.remaining = state.timer.duration[state.timer.mode];
  render();
}
function timerSetMode(mode){
  if (state.timer.running) return;
  state.timer.mode = mode;
  state.timer.remaining = state.timer.duration[mode];
  render();
}

  state.notes[id] = value;
  clearTimeout(notesSaveTimers[id]);
  notesSaveTimers[id] = setTimeout(function(){
    storeSet("notes", JSON.stringify(state.notes)).then(function(){
      const flag = document.querySelector('[data-saved-for="'+id+'"]');
      if (flag){
        flag.classList.add("visible");
        setTimeout(function(){ flag.classList.remove("visible"); }, 1500);
      }
    });
  }, 700);
}

function closeDrawer(){
  document.getElementById("navRail").classList.remove("open");
  document.getElementById("drawerOverlay").classList.remove("open");
}
function toggleDrawer(){
  document.getElementById("navRail").classList.toggle("open");
  document.getElementById("drawerOverlay").classList.toggle("open");
}

document.addEventListener("click", function(e){
  const target = e.target.closest("[data-action]");
  if (!target){
    // close search dropdown / drawer when clicking elsewhere
    if (!e.target.closest(".search-wrap")){
      const sr = document.getElementById("searchResults");
      if (sr) { sr.hidden = true; }
    }
    return;
  }
  const action = target.getAttribute("data-action");

  switch(action){
    case "nav": {
      const view = target.getAttribute("data-view");
      const subject = target.getAttribute("data-subject");
      state.view = view;
      if (view === "subject") state.subject = subject;
      closeDrawer();
      render();
      break;
    }
    case "nav-drawer-toggle": toggleDrawer(); break;
    case "theme-toggle": {
      const next = state.meta.theme === "slate" ? "paper" : "slate";
      state.meta.theme = next;
      applyTheme(next);
      storeSet("meta", JSON.stringify(state.meta));
      break;
    }
    case "toggle-chapter": {
      const id = target.getAttribute("data-id");
      if (state.uiOpen.has(id)) state.uiOpen.delete(id); else state.uiOpen.add(id);
      render();
      break;
    }
    case "set-status": {
      const id = target.getAttribute("data-id");
      const status = target.getAttribute("data-status");
      state.progress[id] = status;
      state.uiOpen.add(id);
      storeSet("progress", JSON.stringify(state.progress));
      if (status === "done") showToast("Chapter marked as revised.");
      render();
      break;
    }
    case "exam-date-edit-toggle": {
      const row = document.getElementById("examEditRow");
      if (row) row.hidden = !row.hidden;
      break;
    }
    case "exam-date-save": {
      const input = document.getElementById("examDateInput");
      if (input && input.value){
        state.meta.examDate = input.value;
        storeSet("meta", JSON.stringify(state.meta));
        showToast("Exam date updated.");
        render();
      }
      break;
    }
    case "vault-filter": {
      state.vaultFilter = target.getAttribute("data-key");
      render();
      break;
    }
    case "quiz-start": startQuiz(target.getAttribute("data-subject")); break;
    case "quiz-select": {
      if (state.quiz.answered) break;
      const idx = parseInt(target.getAttribute("data-index"),10);
      state.quiz.selected = idx;
      state.quiz.answered = true;
      if (idx === state.quiz.questions[state.quiz.index].a) state.quiz.score++;
      render();
      break;
    }
    case "quiz-next": {
      if (state.quiz.index + 1 < state.quiz.questions.length){
        state.quiz.index++;
        state.quiz.selected = null;
        state.quiz.answered = false;
      } else {
        state.quiz.finished = true;
        const record = {date:new Date().toLocaleDateString(), subject:state.quiz.subject, score:state.quiz.score, total:state.quiz.questions.length};
        state.quizHistory.push(record);
        storeSet("quizHistory", JSON.stringify(state.quizHistory));
      }
      render();
      break;
    }
    case "quiz-retry": startQuiz(state.quiz.subject); break;
    case "quiz-exit": {
      state.quiz = {active:false, finished:false, subject:null, questions:[], index:0, score:0, selected:null, answered:false};
      render();
      break;
    }
    case "planner-toggle": {
      const id = target.getAttribute("data-id");
      const task = state.planner.find(function(t){return t.id===id;});
      if (task) task.done = !task.done;
      storeSet("planner", JSON.stringify(state.planner));
      render();
      break;
    }
    case "planner-delete": {
      const id = target.getAttribute("data-id");
      state.planner = state.planner.filter(function(t){return t.id!==id;});
      storeSet("planner", JSON.stringify(state.planner));
      render();
      break;
    }
    case "planner-filter": {
      state.plannerFilter = target.getAttribute("data-key");
      render();
      break;
    }
    case "timer-mode": timerSetMode(target.getAttribute("data-key")); break;
    case "timer-start": timerStart(); break;
    case "timer-pause": timerPause(); break;
    case "timer-reset": timerReset(); break;
    case "timer-subject": {
      state.timer.subject = state.timer.subject === target.getAttribute("data-key") ? "" : target.getAttribute("data-key");
      render();
      break;
    }
    case "search-result": {
      const subject = target.getAttribute("data-subject");
      const chapterNo = parseInt(target.getAttribute("data-chapter"),10);
      state.view = "subject";
      state.subject = subject;
      state.uiOpen.add(chapterId(subject, chapterNo));
      document.getElementById("searchResults").hidden = true;
      document.getElementById("searchInput").value = "";
      closeDrawer();
      render();
      setTimeout(function(){
        const el = document.querySelector('[data-chid="'+chapterId(subject,chapterNo)+'"]');
        if (el) el.scrollIntoView({behavior:"smooth", block:"start"});
      }, 60);
      break;
    }
    case "export-data": {
      const payload = {
        exportedAt:new Date().toISOString(),
        progress:state.progress, notes:state.notes, planner:state.planner,
        quizHistory:state.quizHistory, meta:state.meta
      };
      const blob = new Blob([JSON.stringify(payload,null,2)], {type:"application/json"});
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url; a.download = "pixel-study-data.json";
      document.body.appendChild(a); a.click(); document.body.removeChild(a);
      URL.revokeObjectURL(url);
      showToast("Data exported as a JSON file.");
      break;
    }
    case "reset-data": {
      if (confirm("This clears all progress, notes, planner tasks and quiz history from this app. Continue?")){
        state.progress = {}; state.notes = {}; state.planner = []; state.quizHistory = [];
        const theme = state.meta.theme;
        state.meta = defaultMeta(); state.meta.theme = theme;
        Promise.all([
          storeSet("progress","{}"), storeSet("notes","{}"), storeSet("planner","[]"),
          storeSet("quizHistory","[]"), storeSet("meta", JSON.stringify(state.meta))
        ]).then(function(){ showToast("All data has been reset."); render(); });
      }
      break;
    }
  }
});

document.addEventListener("input", function(e){
  if (e.target.matches('[data-role="notes"]')){
    onNotesInput(e.target.getAttribute("data-id"), e.target.value);
  } else if (e.target.id === "searchInput"){
    runSearch(e.target.value);
  } else if (e.target.id === "vaultSearch"){
    state.vaultQuery = e.target.value;
    render();
    setTimeout(function(){
      const el = document.getElementById("vaultSearch");
      if (el){ el.focus(); el.setSelectionRange(el.value.length, el.value.length); }
    },0);
  }
});

document.addEventListener("submit", function(e){
  if (e.target.id === "plannerForm"){
    e.preventDefault();
    const input = document.getElementById("plannerInput");
    const select = document.getElementById("plannerSubject");
    const text = input.value.trim();
    if (!text) return;
    state.planner.unshift({id:"t"+Date.now(), text:text, subject:select.value||null, done:false, createdAt:Date.now()});
    storeSet("planner", JSON.stringify(state.planner));
    input.value = "";
    render();
  }
});

document.addEventListener("keydown", function(e){
  if (e.key === "Escape"){
    closeDrawer();
    const sr = document.getElementById("searchResults");
    if (sr) sr.hidden = true;
  }
});

/* ============================================================
   BOOT
   ============================================================ */
async function boot(){
  await loadState();
  render();
}
boot();

})();
</script>
